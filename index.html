<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="%VITE_ROBOTS%"/>
    <meta name="description" content="Berg+Schmidt India Pvt. Ltd. - animal nutrition solutions for India's poultry and dairy industries. A subsidiary of Berg+Schmidt Animal Nutrition Group. Operations commenced 2002."/>
    <meta name="theme-color" content="#004c3e"/>
    <!-- Self-hosted Inter (variable) - no third-party font origin. Preload so
         it fetches on the same connection as the app, alongside the CSS. -->
    <link rel="preload" href="/fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin/>
    <!-- Preconnect to Unsplash for hero images -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin/>
    <meta property="og:title" content="Berg+Schmidt India | Animal Nutrition"/>
    <meta property="og:description" content="Science-backed feed additives for poultry and dairy production in India."/>
    <meta property="og:url" content="https://www.berg-schmidt.co.in"/>
    <title>Berg+Schmidt India | Animal Nutrition</title>
    <!-- Favicon: the official Berg+Schmidt Animal Nutrition mark, the same
         files the group site serves. The 32px is declared because browsers
         pick the nearest size and downscaling the 192 to tab size turns the
         mark to mush. favicon.ico is here because Safari and older browsers
         still request /favicon.ico from the site root regardless of these
         tags, and a 404 there leaves a blank tab icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png"/>
    <link rel="icon" href="/favicon.ico" sizes="any"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
