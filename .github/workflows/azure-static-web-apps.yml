name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    # Never run for a pull request opened from a fork: a fork controls the
    # workflow file it checks out, and must not reach the deploy credential.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request'
       && github.event.action != 'closed'
       && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

      - name: Build the production site
        run: npm run build
        env:
          VITE_ROBOTS: index,follow

      # The /beta review copy: the same source built with base '/beta/', so it
      # loads its own assets rather than production's, marked noindex, and
      # dropped into dist/beta. Delete this step and the /beta routes in
      # public/staticwebapp.config.json to retire the review copy.
      - name: Build the /beta review copy
        run: |
          BASE_PATH=/beta/ OUT_DIR=dist-beta VITE_ROBOTS=noindex,nofollow npx vite build
          rm -rf dist/beta && cp -r dist-beta dist/beta

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: dist
          skip_api_build: true

  close_pull_request:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
