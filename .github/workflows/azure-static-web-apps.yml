name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  # Lets the site be redeployed from the Actions tab without a commit. Needed
  # because /beta is built from another branch: pushing only that branch
  # changes nothing until this workflow runs again.
  workflow_dispatch:

# The review branch built and published at /beta. Change this to point the
# review copy at a different branch. To RETIRE /beta: delete the
# "Build the /beta review copy" step below and the /beta routes in
# public/staticwebapp.config.json.
env:
  BETA_REF: chairman-corrections-aug2026

jobs:
  build_and_deploy:
    # Never run for a pull request opened from a fork: a fork controls the
    # workflow file it checks out, and must not reach the deploy credential.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request'
       && github.event.action != 'closed'
       && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - name: Build the production site
        # VITE_ROBOTS fills the %VITE_ROBOTS% placeholder in index.html. Without
        # it Vite leaves the literal token in the shipped HTML and crawlers see
        # a meaningless robots value. Production is indexable; /beta is not.
        run: VITE_ROBOTS=index,follow npm run build

      # The review copy is built from BETA_REF, NOT from this branch, so the
      # live site and the review copy can differ. It is built with base
      # '/beta/' so it loads its own assets, marked noindex, and dropped into
      # dist/beta. This step now FAILS the run rather than continuing quietly:
      # the first attempt reported success while shipping nothing, and a green
      # tick on an empty /beta is worse than a red one.
      - name: Build the /beta review copy
        run: |
          set -eux
          git fetch --depth=1 origin "$BETA_REF"
          rm -rf /tmp/beta-src
          git worktree add --detach /tmp/beta-src FETCH_HEAD
          cd /tmp/beta-src
          npm ci
          BASE_PATH=/beta/ VITE_ROBOTS=noindex,nofollow npx vite build
          rm -rf "$GITHUB_WORKSPACE/dist/beta"
          cp -r dist "$GITHUB_WORKSPACE/dist/beta"
          # The beta branch ships its own staticwebapp.config.json. Two config
          # files inside app_location is undefined behaviour, and the beta
          # branch could drift and silently re-route the live site. One config,
          # at the artifact root, always production's.
          rm -f "$GITHUB_WORKSPACE/dist/beta/staticwebapp.config.json"

      - name: Refuse to deploy an incomplete artifact
        run: |
          set -eu
          # app_location is now the artifact itself, so an empty or partial
          # dist would blank the live site instead of just breaking /beta.
          test -f "$GITHUB_WORKSPACE/dist/index.html"
          test -f "$GITHUB_WORKSPACE/dist/staticwebapp.config.json"
          test -d "$GITHUB_WORKSPACE/dist/assets"
          test -f "$GITHUB_WORKSPACE/dist/beta/index.html"
          test -d "$GITHUB_WORKSPACE/dist/beta/assets"
          test ! -f "$GITHUB_WORKSPACE/dist/beta/staticwebapp.config.json"
          echo "artifact OK:"
          echo "  production : $(ls "$GITHUB_WORKSPACE/dist" | tr '\n' ' ')"
          echo "  beta       : $(ls "$GITHUB_WORKSPACE/dist/beta" | tr '\n' ' ')"

      # skip_app_build is NOT optional here. Without it the action runs its own
      # Oryx build from source, which re-runs `vite build`; Vite empties dist,
      # and the /beta folder assembled above is destroyed before upload. The
      # first deploy of /beta failed for exactly this reason. With it, the
      # action uploads the dist we just built, as-is. app_location then names
      # the FOLDER TO UPLOAD and output_location must be empty.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
